<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Table — The Delight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand"><span class="brand-mark">◆</span> The Delight</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
    <nav class="site-nav" id="siteNav">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>
<main>
  <section class="form-section" id="formView">
    <div class="form-image form-image-booking"></div>
    <div class="form-card">
      <p class="eyebrow">Booking Table</p>
      <h2>Reserve Your Table</h2>
      <form id="bookingForm" class="styled-form">
        <label>Name <input type="text" name="name" placeholder="Your full name" required></label>
        <label>Mobile No. <input type="tel" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required></label>
        <label>Table No. <input type="text" name="table_no" placeholder="Preferred table number" required></label>
        <button type="submit" class="btn btn-primary btn-block">Book Now</button>
      </form>
    </div>
  </section>
  <section class="confirm-section" id="confirmView" style="display:none;">
    <div class="confirm-card">
      <div class="confirm-icon">✓</div>
      <h2>Table Booked</h2>
      <p id="confirmMsg"></p>
      <a href="index.html" class="btn btn-primary">Back to Home</a>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-brand">The Delight</p>
    <p>Serving Delicious Food, made with warmth.</p>
    <div class="footer-links">
      <a href="booking.html">Book a Table</a>
      <a href="delivery.html">Home Delivery</a>
      <a href="feedback.html">Feedback</a>
    </div>
    <p class="footer-copy">&copy; 2026 The Delight. All rights reserved.</p>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script src="js/db.js"></script>
<script src="js/script.js"></script>
<script>
  document.getElementById("bookingForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    await dbReady;
    const f = e.target;
    const name = f.name.value.trim();
    const mobile = f.mobile.value.trim();
    const table_no = f.table_no.value.trim();
    runQuery("INSERT INTO bookings (name, mobile, table_no) VALUES (?, ?, ?)", [name, mobile, table_no]);
    document.getElementById("confirmMsg").innerHTML = `Thank you, ${name}! Table No. <strong>${table_no}</strong> has been reserved for you.`;
    document.getElementById("formView").style.display = "none";
    document.getElementById("confirmView").style.display = "flex";
  });
</script>
</body>
</html>
