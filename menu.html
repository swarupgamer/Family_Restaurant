<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — The Delight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand"><span class="brand-mark">◆</span> The Delight</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
    <nav class="site-nav" id="siteNav">
      <a href="index.html">Home</a>
      <a href="menu.html" class="active">Menu</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>
<main>
  <section class="page-hero page-hero-menu">
    <div class="page-hero-overlay"></div>
    <h1>Our Menu</h1>
    <p>Freshly prepared, always delicious</p>
  </section>
  <section class="menu-section">
    <div class="menu-tabs">
      <button class="tab-btn active" data-tab="nonveg"><span class="dot dot-nonveg"></span> Non-Veg</button>
      <button class="tab-btn" data-tab="veg"><span class="dot dot-veg"></span> Veg</button>
    </div>
    <div class="menu-panel active" id="nonveg"><ul class="menu-list" id="nonvegList"><li>Loading…</li></ul></div>
    <div class="menu-panel" id="veg"><ul class="menu-list" id="vegList"><li>Loading…</li></ul></div>
  </section>
</main>
<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-brand">The Delight</p>
    <p>Serving Delicious Food, made with warmth.</p>
    <div class="footer-links">
      <a href="booking.html">Book a Table</a>
      <a href="delivery.html">Home Delivery</a>
      <a href="feedback.html">Feedback</a>
    </div>
    <p class="footer-copy">&copy; 2026 The Delight. All rights reserved.</p>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script src="js/db.js"></script>
<script src="js/script.js"></script>
<script>
  function renderList(items, dotClass) {
    return items.map(i => `<li><span class="dot ${dotClass}"></span><span class="item-name">${i.name}</span><span class="item-dots"></span><span class="item-price">₹${i.price}</span></li>`).join("");
  }
  dbReady.then(() => {
    const veg = selectAll("SELECT * FROM menu_items WHERE category='Veg' ORDER BY name");
    const nonveg = selectAll("SELECT * FROM menu_items WHERE category='Non-Veg' ORDER BY name");
    document.getElementById("vegList").innerHTML = renderList(veg, "dot-veg");
    document.getElementById("nonvegList").innerHTML = renderList(nonveg, "dot-nonveg");
  });
</script>
</body>
</html>
